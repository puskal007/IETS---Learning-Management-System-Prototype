version: '3.9'

services:

  mysql:
    image: mysql:8.0
    container_name: ieg-lms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: iets_lms
      MYSQL_USER: lmsuser
      MYSQL_PASSWORD: lmspassword123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - lms-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ieg-lms-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: lmsuser
      MYSQL_PASSWORD: lmspassword123
      MYSQL_DATABASE: iets_lms
      JWT_SECRET: iets_super_secret_jwt_key_change_this_2024
      JWT_EXPIRE: 7d
      CORS_ORIGIN: "*"
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - lms-network

volumes:
  mysql_data:
  uploads_data:

networks:
  lms-network:
    driver: bridge
